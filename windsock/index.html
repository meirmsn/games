<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Windsock</title>
    <meta name="description" content="Windsock: draw each plane's path to the runway, land into the wind, and keep the sky clear when the windsock swings." />
    <meta name="theme-color" content="#7fb83d" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../assets/icons/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="../shared/game-shell.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="game.js"></script>
  </head>
  <body>
    <canvas id="field" aria-label="An airfield seen from above, with planes circling"></canvas>

    <div class="hud" data-hud hidden>
      <span class="clock" data-clock>06:00</span>
      <span class="score"><span data-score>0</span><span class="streak" data-streak hidden></span></span>
    </div>

    <button class="mute" type="button" data-mute aria-pressed="false" aria-label="Mute">
      <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" /></svg>
      <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" /></svg>
    </button>

    <section class="card" data-screen="start" hidden>
      <p class="day" data-day>Day 1 · Breezy</p>
      <button class="play" type="button" data-play>Start</button>
      <button class="alt" type="button" data-play9 hidden>Start at 09:00</button>
      <p class="best" data-best-start hidden></p>
    </section>

    <section class="card" data-screen="crash" hidden>
      <h2>Collision</h2>
      <p class="detail" data-crash-detail></p>
      <button class="play" type="button" data-retry>Retry 06:00</button>
      <button class="alt" type="button" data-new>New shift</button>
    </section>

    <section class="card" data-screen="done" hidden>
      <h2>Shift done</h2>
      <p class="score-line"><span data-final-score>0</span> points</p>
      <p class="detail" data-final-detail></p>
      <button class="play" type="button" data-again>Play again</button>
      <button class="alt" type="button" data-another>Another day</button>
    </section>

    <section class="card" data-screen="paused" hidden>
      <h2>Paused</h2>
      <button class="play" type="button" data-resume>Resume</button>
    </section>
  </body>
</html>
