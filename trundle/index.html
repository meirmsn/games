<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Trundle</title>
    <meta name="description" content="Trundle: place planks and wedges so the ball the little robot kicks off rolls into the exit, then watch it run through every room you built." />
    <meta name="theme-color" content="#3a8fd9" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../assets/icons/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="../shared/game-shell.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="matter.min.js"></script>
    <script type="module" src="game.js"></script>
  </head>
  <body>
    <canvas id="board" aria-label="Trundle's machine: the room, its parts and the ball"></canvas>

    <header class="top">
      <div class="title">
        <span class="room-no" data-room-no>1</span>
        <span class="room-text">
          <span class="room-name" data-room-name>Mind the gap</span>
          <span class="room-stars" data-room-stars aria-label="Best stars in this room"></span>
        </span>
      </div>
      <button class="round" type="button" data-rooms aria-label="Rooms">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5" /><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5" /><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5" /><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5" /></svg>
      </button>
      <button class="round mute" type="button" data-mute aria-pressed="false" aria-label="Mute">
        <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" /></svg>
        <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" /></svg>
      </button>
    </header>

    <nav class="bar" data-bar aria-label="Parts and controls">
      <div class="tray" data-tray></div>
      <div class="controls">
        <button class="ctl" type="button" data-turn="-15" aria-label="Turn left" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 6.5A7.5 7.5 0 1 1 5 13" /><path d="M9.5 2.5l-1 4 4 1" /></svg>
        </button>
        <button class="ctl" type="button" data-turn="15" aria-label="Turn right" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 6.5A7.5 7.5 0 1 0 19 13" /><path d="M14.5 2.5l1 4-4 1" /></svg>
        </button>
        <button class="go" type="button" data-go aria-label="Go">
          <svg class="i-go" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" /></svg>
          <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" /></svg>
        </button>
      </div>
    </nav>

    <section class="card" data-card="done" hidden>
      <h2 data-done-title>Room done!</h2>
      <div class="big-stars" data-done-stars></div>
      <div class="row">
        <button class="btn ghost" type="button" data-again>Retry</button>
        <button class="btn" type="button" data-next>Next</button>
      </div>
    </section>

    <section class="card" data-card="floor" hidden>
      <h2>The Workshop runs!</h2>
      <p class="total"><span data-floor-stars>0</span> of 18 stars</p>
      <p class="soon">Floor 2 is still locked.</p>
      <div class="row">
        <button class="btn ghost" type="button" data-replay>Watch again</button>
        <button class="btn" type="button" data-floor-rooms>Rooms</button>
      </div>
    </section>

    <section class="card rooms" data-card="rooms" hidden>
      <h2>Floor 1 · The Workshop</h2>
      <div class="room-grid" data-room-grid></div>
      <div class="row">
        <button class="btn ghost" type="button" data-close-rooms>Close</button>
        <button class="btn" type="button" data-floor-run hidden>Floor run</button>
      </div>
    </section>

    <button class="paused" type="button" data-paused hidden aria-label="Resume">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" /></svg>
    </button>
  </body>
</html>
