<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Beacon</title>
    <meta name="description" content="Beacon: swing the lighthouse beam through a storm night; every ship in the light turns for home." />
    <meta name="theme-color" content="#16233d" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../assets/icons/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="../shared/game-shell.css" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="game.js"></script>
  </head>
  <body>
    <canvas id="sea" aria-label="A storm at night: ships coming in towards a lighthouse at the harbour mouth"></canvas>

    <div class="hud" data-hud hidden>
      <span class="home-icon" aria-hidden="true"></span><strong data-home>0</strong><span class="of">/ <span data-total>0</span></span>
    </div>

    <button class="mute" type="button" data-mute aria-pressed="false" aria-label="Mute">
      <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" /></svg>
      <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" /></svg>
    </button>

    <section class="card start" data-screen="start" hidden>
      <h1>Beacon</h1>
      <div class="coast-pick">
        <button class="arrow" type="button" data-prev aria-label="Previous coast">‹</button>
        <p class="coast"><span data-coast-name>Lantern Cove</span><span class="stars" data-coast-best></span></p>
        <button class="arrow" type="button" data-next aria-label="Next coast">›</button>
      </div>
      <button class="play" type="button" data-start>Light the lamp</button>
    </section>

    <section class="card" data-screen="pause" hidden>
      <h2>Paused</h2>
      <button class="play" type="button" data-resume>Go on</button>
    </section>

    <section class="card dawn" data-screen="dawn" hidden>
      <h2>Dawn</h2>
      <p class="stars big" data-stars aria-label="Stars"></p>
      <p class="tally"><strong data-tally-home>0</strong> of <span data-tally-total>0</span> home</p>
      <p class="close-calls" data-close-calls hidden></p>
      <p class="best" data-best></p>
      <button class="play" type="button" data-next-coast>Next coast</button>
      <button class="link" type="button" data-again>Again</button>
    </section>
  </body>
</html>
